<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>History Bot — ask the past</title>
    <meta
      name="description"
      content="A chat interface for history questions. Pick an era and the assistant adopts that period's expertise."
    />
    <link rel="stylesheet" href="style.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#8987;</text></svg>"
    />
  </head>
  <body>
    <div class="app">
      <!-- ERA RAIL ------------------------------------------------------- -->
      <aside class="rail">
        <div class="rail__head">
          <h1 class="brand">
            <span class="brand__mark" aria-hidden="true"></span>
            History<span class="brand__thin">Bot</span>
          </h1>
        </div>

        <nav class="eras" aria-label="Choose an era">
          <p class="eras__label" id="eras-label">Era</p>
          <div class="eras__list" role="radiogroup" aria-labelledby="eras-label">
            <!-- populated by app.js from /api/eras -->
          </div>
        </nav>

        <div class="rail__foot">
          <button type="button" class="reset" data-reset>
            Clear conversation
          </button>
          <p class="caveat">
            Answers are generated. Dates and quotations can be wrong — verify
            anything that matters.
          </p>
        </div>
      </aside>

      <!-- CONVERSATION ---------------------------------------------------- -->
      <main class="chat">
        <header class="chat__head">
          <div class="now">
            <span class="now__label" data-era-label>All History</span>
            <span class="now__years" data-era-blurb>Anything, any period</span>
          </div>
        </header>

        <div
          class="transcript"
          data-transcript
          role="log"
          aria-live="polite"
          aria-label="Conversation"
        >
          <!-- empty state + messages injected by app.js -->
        </div>

        <form class="composer" data-form>
          <label class="sr-only" for="prompt">Ask a history question</label>
          <textarea
            id="prompt"
            class="composer__input"
            data-input
            rows="1"
            placeholder="Ask a history question…"
            autocomplete="off"
          ></textarea>
          <button type="submit" class="composer__send" data-send>
            <span class="sr-only">Send</span>
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path
                d="M5 12h13m0 0-5.5-5.5M18 12l-5.5 5.5"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>
        </form>
      </main>
    </div>

    <script src="app.js" type="module"></script>
  </body>
</html>
