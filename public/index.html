<!doctype html>
<html lang="en" data-era="all">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vestige — ask the past</title>
    <meta
      name="description"
      content="Vestige — ask the past. A chat interface for history questions: pick an era and the assistant adopts that period's expertise."
    />
    <meta name="color-scheme" content="dark" />

    <!-- Social preview. Absolute URLs are required — crawlers do not resolve
         relative paths against the page they found the tag on. -->
    <meta property="og:title" content="Vestige — ask the past" />
    <meta
      property="og:description"
      content="Pick an era and the assistant takes on that period's expertise, with real objects from the Met Museum alongside each answer."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://vestige-ilw5.onrender.com" />
    <meta
      property="og:image"
      content="https://vestige-ilw5.onrender.com/og.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Vestige — ask the past" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Vestige — ask the past" />
    <meta
      name="twitter:description"
      content="Pick an era and the assistant takes on that period's expertise, with real objects from the Met Museum alongside each answer."
    />
    <meta
      name="twitter:image"
      content="https://vestige-ilw5.onrender.com/og.png"
    />

    <!-- Era display faces are fetched on demand by app.js, never on load.
         Preconnecting means the handshake is already done when they are. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <!-- The mark, defined once. Both the sidebar and the empty state reference
         it with <use>, so the path data lives in exactly one place. No fill is
         set here — it's inherited from whatever uses it, which is how the
         in-page copies follow --accent. -->
    <svg class="sprite" aria-hidden="true" focusable="false">
      <symbol id="vestige-mark" viewBox="0 0 32 32">
        <ellipse cx="8.6" cy="7.2" rx="2.6" ry="3" />
        <ellipse cx="13.3" cy="5" rx="1.95" ry="2.35" />
        <ellipse cx="17.4" cy="4.6" rx="1.85" ry="2.25" />
        <ellipse cx="21.2" cy="5.4" rx="1.7" ry="2.05" />
        <ellipse cx="24.4" cy="7.2" rx="1.5" ry="1.8" />
        <ellipse cx="16.4" cy="14.8" rx="8.4" ry="5.5" />
        <ellipse cx="17" cy="26" rx="5.6" ry="4.6" />
      </symbol>
    </svg>

    <div class="app" data-app>
      <!-- RAIL ------------------------------------------------------------ -->
      <aside class="rail" data-rail>
        <div class="rail__head">
          <h1 class="brand">
            <svg class="brand__mark" aria-hidden="true" focusable="false">
              <use href="#vestige-mark" />
            </svg>
            <span class="brand__name">Vestige</span>
            <span class="brand__tag">ask the past</span>
          </h1>
        </div>

        <button type="button" class="new-chat" data-new>
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path
              d="M12 5v14M5 12h14"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            />
          </svg>
          New chat
        </button>

        <nav class="convos" data-convos aria-label="Your conversations">
          <!-- injected by app.js -->
        </nav>

        <div class="rail__foot">
          <p class="caveat">
            Answers are generated. Dates and quotations can be wrong — verify
            anything that matters.
          </p>
        </div>
      </aside>

      <div class="scrim" data-scrim hidden></div>

      <!-- CHAT ------------------------------------------------------------ -->
      <main class="chat">
        <header class="chat__head">
          <button
            type="button"
            class="icon-btn chat__menu"
            data-menu
            aria-label="Show conversations"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path
                d="M4 7h16M4 12h16M4 17h16"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
              />
            </svg>
          </button>

          <div class="now">
            <span class="now__era" data-era-label>All History</span>
            <span class="now__title" data-convo-title>New conversation</span>
          </div>

          <button
            type="button"
            class="icon-btn"
            data-delete
            aria-label="Delete this conversation"
            hidden
          >
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path
                d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13M10 11v6M14 11v6"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>
        </header>

        <!-- Deliberately NOT aria-live. The reply's HTML is rewritten on every
             streamed token, so a live region here would re-announce the whole
             answer hundreds of times. The finished reply is announced once,
             via the polite region at the end of the document instead. -->
        <div class="transcript" data-transcript role="log" aria-label="Conversation">
          <!-- injected by app.js -->
        </div>

        <!-- The jump button is docked to the composer rather than floated over
             the transcript, so it can never sit on top of a message. -->
        <div class="composer-dock">
          <button type="button" class="to-bottom" data-to-bottom hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path
                d="M12 5v14m0 0 6-6m-6 6-6-6"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
            Latest
          </button>

          <form class="composer" data-form>
          <label class="sr-only" for="prompt">Ask a history question</label>
          <textarea
            id="prompt"
            class="composer__input"
            data-input
            rows="1"
            placeholder="Ask a history question…"
            autocomplete="off"
          ></textarea>

          <!-- One control, two states. Two separate buttons meant the visible
               one depended on the `hidden` attribute winning against CSS —
               which it didn't, because `display: grid` overrides it. With a
               single button, showing both is not expressible. Keeping the same
               element across states also keeps focus, which toggling two
               buttons would destroy. -->
          <button
            type="button"
            class="composer__action"
            data-action
            data-state="send"
            aria-label="Send"
          >
            <svg
              class="composer__icon composer__icon--send"
              viewBox="0 0 24 24"
              aria-hidden="true"
              focusable="false"
            >
              <path
                d="M5 12h13m0 0-5.5-5.5M18 12l-5.5 5.5"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
            <svg
              class="composer__icon composer__icon--abort"
              viewBox="0 0 24 24"
              aria-hidden="true"
              focusable="false"
            >
              <rect x="7" y="7" width="10" height="10" rx="1.5" fill="currentColor" />
            </svg>
          </button>
          </form>
        </div>
      </main>
    </div>

    <!-- Announces one finished reply at a time to screen readers. -->
    <div class="sr-only" data-announcer role="status" aria-live="polite"></div>

    <!-- Row menu. Lives at body level, positioned with `fixed`, because the
         sidebar scrolls — an absolutely positioned menu would be clipped. -->
    <div class="menu" data-menu-pop role="menu" hidden>
      <button type="button" class="menu__item" role="menuitem" data-act="rename">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path
            d="M4 20h4L18.5 9.5a2.1 2.1 0 0 0-3-3L5 17v3Z"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
        Rename
      </button>
      <button
        type="button"
        class="menu__item menu__item--danger"
        role="menuitem"
        data-act="delete"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path
            d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13M10 11v6M14 11v6"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
        Delete
      </button>
    </div>

    <dialog class="confirm" data-confirm>
      <h2 class="confirm__title">Delete this conversation?</h2>
      <p class="confirm__body">
        <strong data-confirm-name></strong> and all its messages will be
        permanently removed. This can't be undone.
      </p>
      <div class="confirm__actions">
        <button type="button" class="btn" data-confirm-cancel>Cancel</button>
        <button type="button" class="btn btn--danger" data-confirm-ok>
          Delete
        </button>
      </div>
    </dialog>

    <script src="app.js" type="module"></script>
  </body>
</html>
