<!doctype html>
<html lang="en" data-era="all">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>History Bot — ask the past</title>
    <meta
      name="description"
      content="A chat interface for history questions. Pick an era and the assistant adopts that period's expertise."
    />
    <meta name="color-scheme" content="dark" />

    <!-- Era display faces are fetched on demand by app.js, never on load.
         Preconnecting means the handshake is already done when they are. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="style.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#8987;</text></svg>"
    />
  </head>
  <body>
    <div class="app" data-app>
      <!-- RAIL ------------------------------------------------------------ -->
      <aside class="rail" data-rail>
        <div class="rail__head">
          <h1 class="brand">
            <span class="brand__mark" aria-hidden="true"></span>
            History<span class="brand__thin">Bot</span>
          </h1>
        </div>

        <button type="button" class="new-chat" data-new>
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path
              d="M12 5v14M5 12h14"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            />
          </svg>
          New chat
        </button>

        <nav class="convos" data-convos aria-label="Your conversations">
          <!-- injected by app.js -->
        </nav>

        <div class="rail__foot">
          <p class="caveat">
            Answers are generated. Dates and quotations can be wrong — verify
            anything that matters.
          </p>
        </div>
      </aside>

      <div class="scrim" data-scrim hidden></div>

      <!-- CHAT ------------------------------------------------------------ -->
      <main class="chat">
        <header class="chat__head">
          <button
            type="button"
            class="icon-btn chat__menu"
            data-menu
            aria-label="Show conversations"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path
                d="M4 7h16M4 12h16M4 17h16"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
              />
            </svg>
          </button>

          <div class="now">
            <span class="now__era" data-era-label>All History</span>
            <span class="now__title" data-convo-title>New conversation</span>
          </div>

          <button
            type="button"
            class="icon-btn"
            data-delete
            aria-label="Delete this conversation"
            hidden
          >
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path
                d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13M10 11v6M14 11v6"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>
        </header>

        <div
          class="transcript"
          data-transcript
          role="log"
          aria-live="polite"
          aria-label="Conversation"
        >
          <!-- injected by app.js -->
        </div>

        <form class="composer" data-form>
          <label class="sr-only" for="prompt">Ask a history question</label>
          <textarea
            id="prompt"
            class="composer__input"
            data-input
            rows="1"
            placeholder="Ask a history question…"
            autocomplete="off"
          ></textarea>

          <button
            type="button"
            class="composer__stop"
            data-stop
            hidden
            aria-label="Stop generating"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <rect x="7" y="7" width="10" height="10" rx="1.5" fill="currentColor" />
            </svg>
          </button>

          <button type="submit" class="composer__send" data-send>
            <span class="sr-only">Send</span>
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path
                d="M5 12h13m0 0-5.5-5.5M18 12l-5.5 5.5"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>
        </form>
      </main>
    </div>

    <!-- Row menu. Lives at body level, positioned with `fixed`, because the
         sidebar scrolls — an absolutely positioned menu would be clipped. -->
    <div class="menu" data-menu-pop role="menu" hidden>
      <button type="button" class="menu__item" role="menuitem" data-act="rename">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path
            d="M4 20h4L18.5 9.5a2.1 2.1 0 0 0-3-3L5 17v3Z"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
        Rename
      </button>
      <button
        type="button"
        class="menu__item menu__item--danger"
        role="menuitem"
        data-act="delete"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path
            d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13M10 11v6M14 11v6"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
        Delete
      </button>
    </div>

    <dialog class="confirm" data-confirm>
      <h2 class="confirm__title">Delete this conversation?</h2>
      <p class="confirm__body">
        <strong data-confirm-name></strong> and all its messages will be
        permanently removed. This can't be undone.
      </p>
      <div class="confirm__actions">
        <button type="button" class="btn" data-confirm-cancel>Cancel</button>
        <button type="button" class="btn btn--danger" data-confirm-ok>
          Delete
        </button>
      </div>
    </dialog>

    <script src="app.js" type="module"></script>
  </body>
</html>
